<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce 002 | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end - Copy/assets/css/bootstrap.min.css">

<body>
    <div class="alert alert-info alert-dismissible text-center p-2 mb-0 rounded-0 fade show">
        <span>50% off on New Collection</span>
        <span class="badge text-bg-secondary rounded-1">Men</span>
        <span class="badge text-bg-secondary rounded-1">Women</span>
        <button type="button" class="btn-close pb-lg-1 small" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <section id="heder-top">
        <nav class="navbar bg-dark navbar-expand-lg py-2">
            <div class="container">
                <div class="row d-flex w-100">
                    <div class="col-3 d-flex gap-4">
                        <div>
                            <a href="#">
                                <i class="bi bi-search text-white fs-4"></i>
                            </a>
                        </div>

                        <div>
                            <a href="#">
                                <i class="bi bi-heart text-white fs-4"></i>
                            </a>
                        </div>
                    </div>
                    <div class="col-6 d-flex justify-content-center align-items-center">

                    </div>
                    <div class="col-3 d-flex gap-4 justify-content-end">
                        <div>
                            <a href="#">
                                <i class="bi bi-person-circle text-white fs-4"></i>
                            </a>
                        </div>

                        <div>
                            <a href="#">
                                <i class="bi bi-cart text-white fs-4"></i>
                            </a>
                        </div>
                    </div>

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="heder-bottom-element" class="collapse navbar-collapse">

                    <div class="row w-100 align-items-center">

                        <!-- Search -->
                        <div class="col-lg-8">
                            <ul class="navbar-nav gap-4">

                                <li class="nav-item">
                                    <a class="nav-link text-white px-2" href="#">
                                        Home
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link text-white px-2" href="#">
                                        Shop
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link text-white px-2" href="#">
                                        Collection
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link text-white px-2" href="#">
                                        Blogs
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link text-white px-2" href="#">
                                        Pages
                                    </a>
                                </li>

                            </ul>
                        </div>

                        <div class="col-lg-4 d-flex justify-content-end mt-2 mt-lg-0 gap-3">
                            <div class="d-flex align-items-center gap-2 text-end text-white">
                                <i class="bi bi-telephone-plus fs-6"></i>
                                <div class="small lh-1">
                                    <a href="#" class="nav-link"> <span class="fw-semibold fs-6">Call us:</span>
                                        <span class="fst-italic text-white">
                                            (+8801797405013)</span></a>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 text-end">
                                <a href="#"><i class="bi bi-gear text-white fs-5"></i></a>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </nav>

    <script src="/bootstrap/ecommerce-front-end - Copy/assets/js/bootstrap.min.js"></script>
