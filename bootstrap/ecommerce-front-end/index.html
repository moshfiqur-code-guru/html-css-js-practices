<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce 001 | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/style.css">

</head>

<body>
    <div class="alert alert-info alert-dismissible text-center p-2 mb-0 rounded-0 fade show">
        <span>50% off on New Collection</span>
        <span class="badge text-bg-secondary rounded-1">Men</span>
        <span class="badge text-bg-secondary rounded-1">Women</span>
        <button type="button" class="btn-close pb-lg-1 small" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <section id="heder-top">
        <nav class="navbar bg-primary navbar-expand-lg py-1">
            <div class="container">

                <a class="navbar-brand text-white p-0" href="#">
                    <img src="assets/img/logo-white.webp" class="logo-img" alt="...">
                </a>

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#heder-top-element"
                    aria-controls="heder-top-element" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="heder-top-element" class="collapse navbar-collapse">

                    <div class="row w-100 align-items-center">

                        <!-- Left -->
                        <div class="col-lg-3 d-flex align-items-center gap-2 select-menu">
                            <select class="text-white form-select form-select-sm w-auto form-select-custome-size">
                                <option selected>U.S.D</option>
                                <option>B.D.T</option>
                                <option>E.U.R</option>
                                <option>G.B.P</option>
                            </select>

                            <select class="text-white form-select form-select-sm w-auto form-select-custome-size">
                                <option selected>Eng</option>
                                <option>Ban</option>
                            </select>
                        </div>


                        <!-- Center -->
                        <div class="col-lg-6">
                            <ul class="navbar-nav justify-content-center gap-2">

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Home
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Shop
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Collection
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Blogs
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Pages
                                    </a>
                                </li>

                            </ul>
                        </div>


                        <!-- Right -->
                        <div class="col-lg-3 d-flex justify-content-end align-items-center">

                            <div class="d-flex align-items-center gap-3">

                                <!-- Account -->
                                <div class="d-flex align-items-center gap-2 text-white">
                                    <i class="bi bi-person-square fs-4"></i>

                                    <div class="small lh-1">
                                        <div class="fw-semibold fs-6">Account</div>

                                        <div>
                                            <a href="#" class="text-white text-decoration-none">
                                                Login
                                            </a>
                                            <span> | </span>
                                            <a href="#" class="text-white text-decoration-none">
                                                Register
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <!-- Wishlist -->
                                <a href="#" class="text-white fs-4 lh-1">
                                    <i class="bi bi-heart"></i>
                                </a>

                                <!-- Cart -->
                                <a href="#" class="text-white fs-4 lh-1">
                                    <i class="bi bi-cart"></i>
                                </a>

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </nav>
    </section>

    <section id="heder-buttom">
        <nav class="navbar navbar-expand-lg bg-light py-2">
            <div class="container">

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#heder-bottom-element"
                    aria-controls="heder-bottom-element" aria-expanded="false" aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="heder-bottom-element" class="collapse navbar-collapse">

                    <div class="row w-100 align-items-center">

                        <!-- Search -->
                        <div class="col-lg-7 d-flex gap-2">

                            <select class="form-select form-select-sm w-auto rounded-3">
                                <option selected>All Categories</option>
                                <option>Headphones</option>
                                <option>Earbuds</option>
                                <option>Accessories</option>
                            </select>

                            <div class="input-group">
                                <input type="text" class="form-control form-control-sm"
                                    placeholder="Search products...">

                                <button class="btn btn-dark" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>

                        </div>

                        <!-- Social Media & Phone -->
                        <div class="col-lg-5 d-flex justify-content-end mt-2 mt-lg-0 gap-3">

                            <div class="d-flex align-items-center gap-2 text-end">

                                <i class="bi bi-telephone-plus fs-4"></i>

                                <div class="small lh-1">
                                    <div class="fw-semibold fs-6">
                                        Call us now
                                    </div>

                                    <div class="fst-italic">
                                        +8801797405013
                                    </div>
                                </div>

                            </div>

                            <div class="d-flex align-items-center gap-3">

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-facebook"></i>
                                </a>

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-twitter-x"></i>
                                </a>

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-instagram"></i>
                                </a>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </nav>
    </section>

    <section id="offer-section">
        <div class="container border my-3">
            <div class="row">
                <div class="col border d-flex align-items-center gap-4 px-4 py-3">
                    <div><i class="bi bi-truck fs-2"></i></div>
                    <figure>
                        <blockquote class="blockquote">
                            <p class="fw-bold">FREE SHIPPING & RETURN</p>
                        </blockquote>
                        <figcaption class="blockquote-footer">
                            Free shipping on all order over $99
                        </figcaption>
                    </figure>
                </div>
                <div class="col border d-flex align-items-center gap-4 px-4 py-3">
                    <div><i class="bi bi-cash-coin fs-2"></i></div>
                    <figure>
                        <blockquote class="blockquote">
                            <p class="fw-bold">MONEY BACK GUARANTEE</p>
                        </blockquote>
                        <figcaption class="blockquote-footer">
                            100% Money back guarantee on return
                        </figcaption>
                    </figure>
                </div>
                <div class="col border d-flex align-items-center gap-4 px-4 py-3">
                    <div><i class="bi bi-chat-left-dots fs-2"></i></div>
                    <figure>
                        <blockquote class="blockquote">
                            <p class="fw-bold">ONLINE SUPPORT</p>
                        </blockquote>
                        <figcaption class="blockquote-footer">
                            24/7 online support available
                        </figcaption>
                    </figure>
                </div>
            </div>
        </div>
    </section>

    <section id="main-content">
        <div class="container">
            <div class="row">
                <div class="col-3 gx-0">
                    <ul class="list-group">
                        <li class="list-group-item active rounded-4 fs-6 mb-2" aria-current="true">Categories</li>
                    </ul>
                    <ul class="list-group rounded-4">
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Men’s Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Women’s
                            Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Kids’s
                            Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Shoes</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Bags</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Watches</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Jewelry</a>
                        <a href="#" class="list-group-item list-group-item-action fw-normal">Accessories</a>
                    </ul>
                </div>
                <div class="col-9">
                    <div class="offer-slider">
                        <div id="offer-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#offer-carousel" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#offer-carousel" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#offer-carousel" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>
                            <div class="carousel-inner rounded-4">
                                <div class="carousel-item active">
                                    <div class="offer-img-wraper"><img src="assets/img/h7.jpg"></div>
                                </div>
                                <div class="carousel-item">
                                    <div class="offer-img-wraper"><img src="assets/img/t1 (1).jpg"></div>
                                </div>
                                <div class="carousel-item">
                                    <div class="offer-img-wraper"><img src="assets/img/t1 (4).jpg"></div>
                                </div>
                            </div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#offer-carousel"
                                data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#offer-carousel"
                                data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </section>






    <script src="/bootstrap/ecommerce-front-end/assets/js/bootstrap.min.js"></script>
</body>

</html>
