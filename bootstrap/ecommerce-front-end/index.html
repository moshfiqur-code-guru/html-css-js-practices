<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce 001 | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/bootstrap/ecommerce-front-end/assets/css/style.css">

</head>

<body>
    <div class="alert alert-info alert-dismissible text-center p-2 mb-0 rounded-0 fade show">
        <span>50% off on New Collection</span>
        <span class="badge text-bg-secondary rounded-1">Men</span>
        <span class="badge text-bg-secondary rounded-1">Women</span>
        <button type="button" class="btn-close pb-lg-1 small" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <section id="heder-top">
        <nav class="navbar bg-primary navbar-expand-lg py-1">
            <div class="container">

                <a class="navbar-brand text-white p-0" href="#">
                    <img src="assets/img/logo-white.webp" class="logo-img" alt="...">
                </a>

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#heder-top-element"
                    aria-controls="heder-top-element" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="heder-top-element" class="collapse navbar-collapse">

                    <div class="row w-100 align-items-center">

                        <!-- Left -->
                        <div class="col-lg-3 d-flex align-items-center gap-2 select-menu">
                            <select class="text-white form-select form-select-sm w-auto form-select-custome-size">
                                <option selected>U.S.D</option>
                                <option>B.D.T</option>
                                <option>E.U.R</option>
                                <option>G.B.P</option>
                            </select>

                            <select class="text-white form-select form-select-sm w-auto form-select-custome-size">
                                <option selected>Eng</option>
                                <option>Ban</option>
                            </select>
                        </div>


                        <!-- Center -->
                        <div class="col-lg-6">
                            <ul class="navbar-nav justify-content-center gap-2">

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Home
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Shop
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Collection
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Blogs
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link active text-white px-2" href="#">
                                        Pages
                                    </a>
                                </li>

                            </ul>
                        </div>


                        <!-- Right -->
                        <div class="col-lg-3 d-flex justify-content-end align-items-center">

                            <div class="d-flex align-items-center gap-3">

                                <!-- Account -->
                                <div class="d-flex align-items-center gap-2 text-white">
                                    <i class="bi bi-person-square fs-4"></i>

                                    <div class="small lh-1">
                                        <div class="fw-semibold fs-6">Account</div>

                                        <div>
                                            <a href="#" class="text-white text-decoration-none">
                                                Login
                                            </a>
                                            <span> | </span>
                                            <a href="#" class="text-white text-decoration-none">
                                                Register
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <!-- Wishlist -->
                                <a href="#" class="text-white fs-4 lh-1">
                                    <i class="bi bi-heart"></i>
                                </a>

                                <!-- Cart -->
                                <a href="#" class="text-white fs-4 lh-1">
                                    <i class="bi bi-cart"></i>
                                </a>

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </nav>
    </section>

    <section id="heder-buttom">
        <nav class="navbar navbar-expand-lg py-2">
            <div class="container">

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#heder-bottom-element"
                    aria-controls="heder-bottom-element" aria-expanded="false" aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="heder-bottom-element" class="collapse navbar-collapse">

                    <div class="row w-100 align-items-center">

                        <!-- Search -->
                        <div class="col-lg-7 d-flex gap-2">

                            <select class="form-select form-select-sm w-auto rounded-3">
                                <option selected>All Categories</option>
                                <option>Headphones</option>
                                <option>Earbuds</option>
                                <option>Accessories</option>
                            </select>

                            <div class="input-group border rounded-3">
                                <input type="text" class="form-control form-control-sm border-0 rounded-4"
                                    placeholder="Search products...">

                                <button class="btn btn-dark border-0 rounded-3" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>

                        </div>

                        <!-- Social Media & Phone -->
                        <div class="col-lg-5 d-flex justify-content-end mt-2 mt-lg-0 gap-3">

                            <div class="d-flex align-items-center gap-2 text-end">

                                <i class="bi bi-telephone-plus fs-4"></i>

                                <div class="small lh-1">
                                    <div class="fw-semibold fs-6">
                                        Call us now
                                    </div>

                                    <div class="fst-italic">
                                        +8801797405013
                                    </div>
                                </div>

                            </div>

                            <div class="d-flex align-items-center gap-3">

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-facebook"></i>
                                </a>

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-twitter-x"></i>
                                </a>

                                <a href="#" class="fs-5 lh-1 text-black">
                                    <i class="bi bi-instagram"></i>
                                </a>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </nav>
    </section>






    <script src="/bootstrap/ecommerce-front-end/assets/js/bootstrap.min.js"></script>
</body>

</html>
