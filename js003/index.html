<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create_account</title>
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Splash&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="section flex">
        <div class="container flex">
            <div class="side-thumb">
                <div class="thumb-content flex">
                    <div class="flex between">
                        <div class="logo">Sadik</div>
                        <div class="website-shortcut">
                            Back to website
                            <i data-feather="arrow-up-right"></i>
                        </div>
                    </div>
                    <div class="bottom-text">
                        <span>Capture Moment, <br> Create Memories</span>
                    </div>
                </div>
                <img src="assets/img/side-thump.png" alt="">
            </div>
            <div class="form-area" id="createAccountContent">
                <h1 class="title">Create an account</h1>
                <span id="direct-login">Already have an account? <a href="#">Login</a></span>

                <form method="get" onsubmit="formSubmission()" name="createAccount">

                    <div class="form-group name flex">
                        <div class="form-group">
                            <input type="text" id="firstName" name="firstName" placeholder="First name">
                        </div>

                        <div class="form-group">
                            <input type="text" id="lastName" name="lastName" placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="E-mail">
                    </div>

                    <div class="form-group password">
                        <input type="password" id="password" name="password" placeholder="Password">
                        <div class="toggle flex">
                            <div class="show" onmousedown="event.preventDefault()" onclick="showPassword(this)">
                                <i data-feather="eye"></i>
                            </div>

                            <div class="hide" onmousedown="event.preventDefault()" onclick="hidePassword(this)">
                                <i data-feather="eye-off"></i>
                            </div>
                        </div>
                    </div>
                    <div class="terms flex">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            I agree to the <a href="#">Terms & Conditions</a>
                        </label>
                    </div>


                    <div class="submit">
                        <span id="SignupError"></span>
                        <div class="submit-button">
                            <input type="submit" value="Create account">
                        </div>
                    </div>
                </form>
                <div class="other-options">
                    <span>Or sign-in with </span>
                </div>
                <div class="other-option-button">
                    <button>
                        <i class="fa-brands fa-google"></i>
                        | Google
                    </button>
                    <button>
                        <i class="fa-brands fa-microsoft"></i>
                        | Microsoft
                    </button>
                </div>
            </div>



            <div class="login-area" id="loginContent">
                <h1 class="title">Login</h1>

                <form method="get" onsubmit="doLogin()" name="loginContent">

                    <div class="form-group">
                        <input type="email" id="userEmail" name="email" placeholder="E-mail">
                    </div>

                    <div class="form-group password">
                        <input type="password" id="UserPass" name="password" placeholder="Password">
                        <div class="toggle flex">
                            <div class="show" onmousedown="event.preventDefault()" onclick="showPassword(this)">
                                <i data-feather="eye"></i>
                            </div>

                            <div class="hide" onmousedown="event.preventDefault()" onclick="hidePassword(this)">
                                <i data-feather="eye-off"></i>
                            </div>
                        </div>

                    </div>

                    <div class="login-button">
                        <span id="LoginError"></span>
                        <div class="submit-button">
                            <input type="submit" value="Login">
                        </div>
                    </div>
                </form>
                <div class="other-options">
                    <span>Or sign-in with </span>
                </div>
                <div class="other-option-button">
                    <button>
                        <i class="fa-brands fa-google"></i>
                        | Google
                    </button>
                    <button>
                        <i class="fa-brands fa-microsoft"></i>
                        | Microsoft
                    </button>
                </div>
            </div>

            <div class="login-area" id="dashbord">
                <h1 class="title">Welcome back,</h1>
                <h3 id="welcome"></h3>
                <p>This is your dashboard</p>

                <div class="other-options">
                    <span id="date"> </span>
                </div>
                <div class="other-option-button login-logout">
                    <button onclick="doLogout()">
                        <i data-feather="log-out"></i>
                        LOGOUT
                    </button>
                </div>

            </div>
        </div>


    </section>




    <script>
        feather.replace();
    </script>
    <script src="assets/js/script.js"></script>
</body>

</html>
