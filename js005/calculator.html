<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard_page</title>
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Splash&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/js005/style2.css">
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <section class="section flex">
        <div class="container flex">
            <div class="side-panel flex column between">
                <div class="profile">
                    <div class="author flex">
                        <img src="avater.jpg" alt="author">
                    </div>
                    <span>Moshfiqur Rahman</span>
                </div>

                <ul class="menu flex column">

                    <li class="dashboard"> <a href="dashboard.html">
                            <i data-feather="home"></i>
                            <span>Home</span>
                        </a>
                    </li>

                    <li class="user"><a href="user.html">
                            <i data-feather="users"></i>
                            <span>Users</span>
                        </a>
                    </li>

                    <li class="orders"><a href="order.html">
                            <i data-feather="shopping-cart"></i>
                            <span>Orders</span>
                        </a>
                    </li>

                    <li class="analytics"><a href="analytics.html">
                            <i data-feather="bar-chart-2"></i>
                            <span>Analytics</span>
                        </a>
                    </li>

                    <li class="calculator"><a href="calculator.html">
                            <i data-feather="divide-square"></i>
                            <span>Calculator</span>
                        </a>
                    </li>

                    <li class="settings"><a href="settings.html">
                            <i data-feather="settings"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>

                <div class="footer">
                    <span>&copy; Copyright 2026</span>

                </div>
            </div>


            <div class="main-content">
                <div class="top-bar between flex">
                    <div>
                        <h1>Calculator 🧮</h1>
                        <p>Here's what's happening today.</p>
                    </div>

                    <div class="options flex">
                        <ul class="flex">
                            <li>
                                <i data-feather="bell"></i>
                            </li>
                            <li onclick="logout()">
                                <i data-feather="log-out"></i>
                                <span>Logout</span>
                            </li>
                        </ul>

                    </div>
                </div>

                <div class="content">
                    <div class="calculation">
                        <p id="result">Result:</p>

                        <label for="firstNumber">First Number</label>
                        <input type="number" id="firstNumber">

                        <label for="secondNumber">Second Number</label>
                        <input type="number" id="secondNumber">

                        <button onclick="addition()">Add</button>
                    </div>
                </div>
    </section>
    <script>
        feather.replace();
    </script>
    <script src="/js005/script.js"></script>
    <script src="calculator.js"></script>
</body>

</html>
