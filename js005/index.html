<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Splash&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/js005/style.css">
</head>

<body>
    <section class="section flex">
        <div class="container flex">
            <div class="login-area form-area" id="loginContent">
                <h1 class="title">Login</h1>

                <form method="get" onsubmit="doLogin()" name="loginContent">

                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder="Username">
                    </div>

                    <div class="form-group password">
                        <input type="password" id="UserPass" name="password" placeholder="Password">
                        <div class="toggle flex">
                            <div class="show" onmousedown="event.preventDefault()" onclick="showPassword(this)">
                                <i data-feather="eye"></i>
                            </div>

                            <div class="hide" onmousedown="event.preventDefault()" onclick="hidePassword(this)">
                                <i data-feather="eye-off"></i>
                            </div>
                        </div>

                    </div>

                    <div class="login-button">
                        <span id="LoginError"></span>
                        <div class="submit-button">
                            <input type="submit" value="Login">
                        </div>
                    </div>
                </form>
                <div class="other-options">
                    <span>Or sign-in with </span>
                </div>
                <div class="other-option-button">
                    <button>
                        <i class="fa-brands fa-google"></i>
                        | Google
                    </button>
                    <button>
                        <i class="fa-brands fa-microsoft"></i>
                        | Microsoft
                    </button>
                </div>
            </div>
        </div>


    </section>
    <script>
        feather.replace();
    </script>
    <script src="/js005/script.js"></script>
</body>

</html>
