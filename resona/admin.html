<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resona</title>
    <!-- <script src="https://unpkg.com/feather-icons"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <section class="login-section" id="login-section">
        <div class="login-container flex column" id="loginScreen">
            <div class="flex column align-center login-head">
                <i class="ti ti-brand-framer"></i>
                <span>Resona Admin</span>
            </div>
            <div class="flex column align-center login-form">
                <form method="get" class="flex column" onsubmit="doLogin(event)" name="loginInfo">
                    <div class="user-name-pass">
                        <i class="ti ti-user-circle name-pass"></i>
                        <input type="text" placeholder="Username" name="userName">
                    </div>
                    <div class="user-name-pass">
                        <i class="ti ti-key name-pass"></i>
                        <input type="password" placeholder="Password" name="password" id="password">

                        <img src="assets/logo/eye-off.svg" alt="" id="hide" onclick="showHidePass('password')">
                        <img src="assets/logo/eye.svg" alt="" i id="show" onclick="showHidePass('text')">

                    </div>

                    <small class="animate__animated animate__headShake" id="loginErrorMsg"></small>
                    <button class="login-btn" type="submit">Login</button>
                </form>
            </div>

        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
